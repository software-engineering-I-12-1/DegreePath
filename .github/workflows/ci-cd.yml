name: DegreePath CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. FRONTEND: Build & Type-Check
  # ---------------------------------------------------------------------------
  frontend-check:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install dependencies
        run: npm install

      - name: Build and Type Check
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. BACKEND: Unit Tests, Password Hashing, & NFR Verification
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend (Django & Automated Verification)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        env:
          SECRET_KEY: test-secret-key-for-github-actions
          DEBUG: 'True'
        run: |
          python manage.py test

  # ---------------------------------------------------------------------------
  # 3. CONTINUOUS DEPLOYMENT (Only triggered on main push after tests pass)
  # ---------------------------------------------------------------------------
  deploy:
    name: Continuous Deployment (Render)
    needs: [frontend-check, backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set yet. Skipping deployment webhook trigger."
          else
            echo "Triggering deployment on Render..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Deployment webhook triggered successfully."
          fi
